<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 기본 리셋 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', dotum, sans-serif;
        }

        /* 1. 화면을 왼쪽과 오른쪽으로 2분할하는 컨테이너 */
        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* 2. 왼쪽: 검색창 + 결과 리스트 영역 */
        .sidebar {
            width: 350px; /* 왼쪽 영역의 너비 */
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column; /* 세로로 배치 */
            padding: 15px;
            z-index: 10;
        }

        /* 검색창 스타일 */
        .search-box {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .search-box input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-box button {
            padding: 8px 15px;
            background-color: #fee500; /* 카카오 시그니처 색상 */
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-box button:hover {
            background-color: #fada0a;
        }

        /* 결과 리스트 스타일 (스크롤 가능하도록) */
        .places-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }
        .places-list li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            background-color: white;
            margin-bottom: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .places-list li:hover {
            background-color: #f1f3f5;
        }
        .places-list h5 {
            margin-bottom: 5px;
            color: #333;
        }
        .places-list p {
            font-size: 12px;
            color: #666;
        }

        /* 3. 오른쪽: 지도 영역 */
        .map-area {
            flex: 1; /* 남은 화면 전체를 차지 */
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="keyword" placeholder="장소를 입력하세요 (예: 강남역)" onkeypress="if(event.keyCode==13) searchPlaces()">
                <button onclick="searchPlaces()">검색</button>
            </div>
            <ul id="placesList" class="places-list"></ul>
        </div>

        <div id="map" class="map-area"></div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7efab4bba64837f7b765ae1bafe04800&libraries=services&autoload=false"></script>
    
    <script>
        // 전역 변수 선언 (여러 함수에서 함께 사용하기 위함)
        let map;
        let ps;
        let infowindow;
        let markers = []; // 마커를 담을 배열

        // [조건 3] 지도가 제대로 로드된 후에 실행되도록 안전하게 로딩
        kakao.maps.load(function() {
            const mapContainer = document.getElementById('map'); 
            const mapOption = {
                center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 위치 (서울시청)
                level: 5 // [조건 4] 지도 확대 레벨 5
            };

            // 지도 생성
            map = new kakao.maps.Map(mapContainer, mapOption);
            
            // 장소 검색 객체와 정보창(말풍선) 생성
            ps = new kakao.maps.services.Places();  
            infowindow = new kakao.maps.InfoWindow({zIndex:1});

            // [조건 2] 페이지가 열리면 위치 권한을 요청하고 현재 위치를 중심으로 설정
            getRealtimeLocation();
        });

        // 사용자의 현재 위치를 가져오는 함수
        function getRealtimeLocation() {
            if (navigator.geolocation) {
                // 브라우저에 위치 권한 요청
                navigator.geolocation.getCurrentPosition(function(position) {
                    const lat = position.coords.latitude;  // 위도
                    const lon = position.coords.longitude; // 경도
                    
                    const locPosition = new kakao.maps.LatLng(lat, lon); // 카카오 좌표 객체 생성
                    
                    // 현재 위치를 중심으로 지도 이동
                    map.setCenter(locPosition);
                    
                    // 현재 위치에 간단한 마커 표시
                    const currentMarker = new kakao.maps.Marker({
                        map: map,
                        position: locPosition
                    });
                    
                    // 말풍선 띄우기
                    infowindow.setContent('<div style="padding:5px;font-size:12px;">현재 위치</div>');
                    infowindow.open(map, currentMarker);
                    
                }, function(error) {
                    console.error("위치 정보를 가져오는데 실패했습니다.", error);
                    alert("위치 권한을 허용하지 않으셨거나 위치를 찾을 수 없어 기본 위치로 표시합니다.");
                });
            } else {
                alert("이 브라우저에서는 GPS 위치 정보를 지원하지 않습니다.");
            }
        }

        // 키워드 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keyword').value;

            if (!keyword.replace(/^\s+|\s+$/g, '')) {
                alert('키워드를 입력해주세요!');
                return false;
            }

            // 카카오 장소 검색 API 실행
            ps.keywordSearch(keyword, placesSearchCB); 
        }

        // 장소검색이 완료됐을 때 호출되는 콜백함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                // 정상적으로 검색이 완료됐으면 검색 목록과 마커를 표출합니다
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
                return;
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 결과 중 오류가 발생했습니다.');
                return;
            }
        }

        // 검색 결과 목록과 마커를 표출하는 함수
        function displayPlaces(places) {
            const listEl = document.getElementById('placesList');
            const bounds = new kakao.maps.LatLngBounds(); // 검색된 장소들을 다 포함하도록 지도를 움직이기 위한 객체
            
            // 기존 검색 결과 리스트 및 마커 지우기
            listEl.innerHTML = '';
            removeMarker();

            for (let i = 0; i < places.length; i++) {
                // 마커를 생성하고 지도에 표시합니다
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                const marker = addMarker(placePosition);
                
                // 검색 결과 HTML 리스트 생성
                const itemEl = document.createElement('li');
                itemEl.innerHTML = `
                    <h5>${places[i].place_name}</h5>
                    <p>${places[i].road_address_name ? places[i].road_address_name : places[i].address_name}</p>
                `;

                // 리스트 아이템이나 마커를 클릭했을 때 말풍선 이벤트 등록
                (function(marker, title, place) {
                    // 지도 마커에 마우스오버 이벤트
                    kakao.maps.event.addListener(marker, 'click', function() {
                        displayInfowindow(marker, title);
                        map.setCenter(new kakao.maps.LatLng(place.y, place.x));
                    });

                    // 왼쪽 리스트 아이템 클릭 이벤트
                    itemEl.onclick = function () {
                        displayInfowindow(marker, title);
                        map.setCenter(new kakao.maps.LatLng(place.y, place.x));
                    };
                })(marker, places[i].place_name, places[i]);

                listEl.appendChild(itemEl);
                bounds.extend(placePosition); // 전체 범위를 넓힘
            }

            // 검색된 장소들이 한눈에 보이도록 지도 범위 재조정
            map.setBounds(bounds);
        }

        // 마커를 생성하는 함수
        function addMarker(position) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });
            markers.push(marker); // 배열에 저장 (나중에 지우기 위함)
            return marker;
        }

        // 기존 마커들을 지우는 함수
        function removeMarker() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }   
            markers = [];
        }

        // 말풍선(정보창)을 표시하는 함수
        function displayInfowindow(marker, title) {
            const content = `<div style="padding:5px; z-index:1; font-size:12px; font-weight:bold;">${title}</div>`;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }
    </script>
</body>
</html>
